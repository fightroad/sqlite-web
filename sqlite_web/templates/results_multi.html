{% for result in results %}
  <div class="script-result">
    <p><code>{{ result.statement|truncate(120, True) }}</code></p>
    {% set in_script = True %}
    {% include "results.html" %}
  </div>
{% endfor %}
{% if total_statements > results|length %}
  <div class="alert alert-warning">
    执行已停止：剩余 {{ total_statements - results|length }} 条语句未运行。
  </div>
{% endif %}
