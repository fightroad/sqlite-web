{% extends "base_table.html" %}

{% block drop_tab_class %} active{% endblock %}

{% block inner_content %}
<h3>删除{% if is_view %}视图{% else %}表{% endif %}</h3>
<form action="{{ url_for('drop_table', table=table) }}" class="form" method="post">
  <p>
    确定要删除 <strong>{{ table }}</strong> 及其全部相关数据吗？
  </p>
  <p><strong>此操作无法撤销。</strong></p>
  <button class="btn btn-danger" type="submit">删除{% if is_view %}视图{% else %}表{% endif %}</button>
  <a class="btn btn-secondary" href="{{ url_for('table_structure', table=table) }}">取消</a>
</form>
{% endblock %}
